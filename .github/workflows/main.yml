name: Weekly PM Job Scraper

on:
  # Scheduled run disabled Oct 2026 — superseded by a Cowork-based daily scan
  # (application-tracker repo). Kept as a manual-only fallback below.
  # schedule:
  #   - cron: '0 17 * * 1,3' # was 12:00 PM EST (17:00 UTC) every Monday and Wednesday
  workflow_dispatch: # Allows manual runs

jobs:
  scrape-and-email:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium

      - name: Run Scraper
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: python scraper.py
